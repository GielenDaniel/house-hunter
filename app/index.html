<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woningen Utrecht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f5f2ed;
    --surface:  #ffffff;
    --ink:      #1a1714;
    --ink-2:    #6b6560;
    --ink-3:    #a09b96;
    --accent:   #c9500a;
    --funda:    #e84c1e;
    --pararius: #00a984;
    --fav:      #c9500a;
    --warn:     #e8a11e;
    --border:   #e4dfd9;
    --shadow:   0 2px 12px rgba(26,23,20,0.07);
    --radius:   12px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--ink);
    color: #fff;
    padding: 28px 40px 0;
  }
  .header-top {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 20px;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  header h1 em { font-style: italic; color: #c9a882; }
  #count { font-size: 0.85rem; color: #a09b96; font-weight: 300; }

  /* ── Category tabs (Koop / Huur) ── */
  .cat-tabs {
    display: flex;
    gap: 4px;
  }
  .cat-tab {
    padding: 10px 24px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    color: #6b6560;
    background: transparent;
    border: none;
    transition: color 0.15s, background 0.15s;
    user-select: none;
  }
  .cat-tab:hover { color: #c9a882; }
  .cat-tab.active { background: var(--bg); color: var(--ink); }

  /* ── Filter tabs (Alle / Nieuw / etc.) ── */
  .filter-bar {
    display: flex;
    gap: 0;
    padding: 0 40px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .filter-tab {
    padding: 11px 18px;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }
  .filter-tab:hover { color: var(--ink-2); }
  .filter-tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  /* ── Grid ── */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 36px 40px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 0;
    color: var(--ink-3);
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    font-style: italic;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.3s ease both;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(26,23,20,0.11);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card.rejected { opacity: 0.4; }

  .card-header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .source-badge {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 4px;
    color: #fff;
  }
  .source-badge.funda    { background: var(--funda); }
  .source-badge.pararius { background: var(--pararius); }
  .found-at { font-size: 0.75rem; color: var(--ink-3); margin-left: auto; }

  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .card-title a { color: var(--ink); text-decoration: none; }
  .card-title a:hover { color: var(--accent); }

  .card-price { font-size: 1.05rem; font-weight: 500; color: var(--accent); }
  .card-area  { font-size: 0.85rem; color: var(--ink-2); margin-left: 8px; }

  /* ── Details ── */
  .card-body {
    padding: 14px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--ink-2);
    line-height: 1.4;
  }
  .detail-row.warn { color: var(--warn); }
  .detail-label { font-weight: 500; color: var(--ink); min-width: 90px; flex-shrink: 0; }
  .maps-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    margin-top: 4px;
  }
  .maps-link:hover { text-decoration: underline; }

  /* ── Actions ── */
  .card-actions {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .btn {
    flex: 1;
    padding: 8px 0;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--ink-2);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .btn.fav-btn.active { background: #fff5f0; border-color: var(--fav); color: var(--fav); }
  .btn.rej-btn.active { background: #f5f2ef; border-color: #b0a89f; color: #b0a89f; }

  #loading {
    text-align: center;
    padding: 80px;
    color: var(--ink-3);
    font-style: italic;
  }

  @media (max-width: 600px) {
    header, main { padding-left: 20px; padding-right: 20px; }
    .filter-bar  { padding-left: 20px; padding-right: 20px; }
    #grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Woningen <em>Utrecht</em></h1>
    <span id="count"></span>
  </div>
  <div class="cat-tabs">
    <button class="cat-tab active" data-cat="koop">Koop</button>
    <button class="cat-tab" data-cat="huur">Huur</button>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-tab active" data-filter="all">Alle</div>
  <div class="filter-tab" data-filter="new">Nieuw</div>
  <div class="filter-tab" data-filter="favourite">Favorieten</div>
  <div class="filter-tab" data-filter="rejected">Afgewezen</div>
</div>

<main>
  <div id="loading">Listings laden…</div>
  <div id="grid" style="display:none"></div>
</main>

<script>
  let allListings  = [];
  let currentCat    = 'koop';
  let currentFilter = 'all';

  async function load(cat) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('grid').style.display    = 'none';
    const res = await fetch(`/api/listings/${cat}`);
    allListings = await res.json();
    allListings.sort((a, b) => (b.found_at || '').localeCompare(a.found_at || ''));
    document.getElementById('loading').style.display = 'none';
    document.getElementById('grid').style.display    = 'grid';
    render();
  }

  function render() {
    const grid = document.getElementById('grid');
    let filtered = allListings;

    if (currentFilter === 'new')       filtered = allListings.filter(l => !l.reaction);
    if (currentFilter === 'favourite') filtered = allListings.filter(l => l.reaction === 'favourite');
    if (currentFilter === 'rejected')  filtered = allListings.filter(l => l.reaction === 'reject');
    if (currentFilter === 'all')       filtered = allListings.filter(l => l.reaction !== 'reject');

    const total = filtered.length;
    document.getElementById('count').textContent =
      total === 1 ? '1 woning' : `${total} woningen`;

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty">Geen woningen gevonden.</div>';
      return;
    }

    grid.innerHTML = filtered.map((l, i) => {
      const isFav = l.reaction === 'favourite';
      const isRej = l.reaction === 'reject';
      const source = l.source.toLowerCase();
      const foundAt = l.found_at
        ? new Date(l.found_at).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
        : '';

      const extraRows = (l.extra || '').split(' | ').filter(Boolean).map(part => {
        const isWarn = part.startsWith('⚠️');
        const colonIdx = part.indexOf(': ');
        if (isWarn) return `<div class="detail-row warn"><span>${part}</span></div>`;
        if (colonIdx > -1) {
          const label = part.slice(0, colonIdx);
          const value = part.slice(colonIdx + 2);
          return `<div class="detail-row"><span class="detail-label">${label}</span><span>${value}</span></div>`;
        }
        return `<div class="detail-row"><span>${part}</span></div>`;
      }).join('');

      const mapsBtn = l.maps_url
        ? `<a class="maps-link" href="${l.maps_url}" target="_blank">📍 Bekijk op kaart</a>`
        : '';

      const enc = encodeURIComponent(l.url);
      return `
        <div class="card ${isRej ? 'rejected' : ''}" style="animation-delay:${i * 0.04}s">
          <div class="card-header">
            <div class="card-meta">
              <span class="source-badge ${source}">${l.source}</span>
              <span class="found-at">${foundAt}</span>
            </div>
            <div class="card-title"><a href="${l.url}" target="_blank">${l.title}</a></div>
            <div>
              <span class="card-price">${l.price}</span>
              <span class="card-area">${l.area}</span>
            </div>
          </div>
          <div class="card-body">
            ${extraRows}
            ${mapsBtn}
          </div>
          <div class="card-actions">
            <button class="btn fav-btn ${isFav ? 'active' : ''}" onclick="react('${enc}', 'favourite')">♥ Favoriet</button>
            <button class="btn rej-btn ${isRej ? 'active' : ''}" onclick="react('${enc}', 'reject')">✕ Afwijzen</button>
          </div>
        </div>`;
    }).join('');
  }

  async function react(encodedUrl, action) {
    const url = decodeURIComponent(encodedUrl);
    const listing = allListings.find(l => l.url === url);
    if (!listing) return;
    const newReaction = listing.reaction === action ? 'clear' : action;
    await fetch(`/api/react/${newReaction}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    listing.reaction = newReaction === 'clear' ? null : newReaction;
    render();
  }

  // Category tabs
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.dataset.cat;
      load(currentCat);
    });
  });

  // Filter tabs
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  load(currentCat);
</script>
</body>
</html>
